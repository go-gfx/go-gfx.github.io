baseURL = 'https://go-gfx.github.io/'
locale  = 'en-us'
title   = 'go-gfx'
# No theme — layouts live in ./layouts

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[params]
  description = "go-gfx is a pure-Go (CGO=0) 2D graphics foundation — geometry, colour science, pixel-buffer rasters, high-quality resampling, image codecs and a vector rasterizer — the shared substrate under go-images, go-widgets/painter, go-webengine and the desktop stack."
  brand       = "go-gfx"
  github      = "go-gfx"
  heroAccent  = "go-gfx"
  heroTagline = "The pure-Go 2D graphics foundation. One substrate, many renderers."

  heroIntro = [
    "<strong>go-gfx</strong> is the pure-Go, <strong>cgo-free</strong> layer that sits <em>below</em> the fleet's image-processing and rendering libraries — the Go answer to what Skia, Cairo and <code>image/draw</code> provide elsewhere. Pixel buffers, colour science, high-quality resampling, image codecs and a vector rasterizer, each usable on its own, with <strong>no third-party dependencies</strong>.",
    "It is <strong>not</strong> an image-processing library (that is <a href=\"https://github.com/go-images/images\">go-images</a>, the scikit-image analogue) and <strong>not</strong> a widget toolkit (that is <a href=\"https://github.com/go-widgets\">go-widgets</a>). It is the common layer both stand on, so colour blending, resampling, codecs and path rasterization are written and tested <strong>once</strong> and shared across the whole ecosystem."
  ]

