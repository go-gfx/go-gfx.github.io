    url        = "#webgpu"
    weight     = 25
  [[menu.main]]
    identifier = "gpu2d"
    name       = "GPU 2D"
    url        = "#gpu2d"
    weight     = 27
  [[menu.main]]
    identifier = "vulkan"
    name       = "Vulkan"
    url        = "#vulkan"
    weight     = 28
  [[menu.main]]
